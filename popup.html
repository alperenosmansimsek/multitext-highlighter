<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Multi Highlighter</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    .mh-popup {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      color: #212529;
      background: #ffffff;
    }
    .container { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .title { font-size: 15px; font-weight: 600; color: #1a1a2e; letter-spacing: 0.3px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .label { font-weight: 500; color: #495057; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
    .textarea { width: 100%; padding: 10px 12px; border: 1.5px solid #dee2e6; border-radius: 8px; font-size: 13px; font-family: inherit; color: #212529; resize: vertical; outline: none; transition: border-color 0.2s; line-height: 1.5; }
    .textarea:focus { border-color: #4D96FF; }
    .hint { font-size: 11px; color: #868e96; line-height: 1.4; }
    .toggle-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-top: 1px solid #f1f3f5; }
    .toggle-label { font-weight: 500; font-size: 13px; color: #343a40; }
    .toggle-hint { font-size: 11px; color: #868e96; margin-top: 2px; line-height: 1.4; }
    .switch { position: relative; display: inline-block; width: 36px; height: 20px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; inset: 0; background-color: #ced4da; border-radius: 20px; transition: background-color 0.2s; }
    .slider::before { content: ""; position: absolute; width: 14px; height: 14px; left: 3px; bottom: 3px; background: white; border-radius: 50%; transition: transform 0.2s; }
    .switch input:checked + .slider { background-color: #4D96FF; }
    .switch input:checked + .slider::before { transform: translateX(16px); }
    .btn-search { width: 100%; padding: 10px; background: #4D96FF; color: white; border: none; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.2s, transform 0.1s; letter-spacing: 0.3px; }
    .btn-search:hover { background: #3b82f6; }
    .btn-search:active { transform: scale(0.98); }
    .btn-clear { width: 100%; padding: 8px; background: transparent; color: #868e96; border: 1.5px solid #dee2e6; border-radius: 8px; font-size: 12px; cursor: pointer; transition: all 0.2s; }
    .btn-clear:hover { border-color: #FF6B6B; color: #FF6B6B; }
  </style>
</head>
<body class="mh-popup">

  <div class="container">

    <h1 class="title">Multi Highlighter</h1>

    <!-- TEXTAREA -->
    <div class="field">
      <label class="label" for="wordsInput">Highlighted words</label>
      <textarea
        id="wordsInput"
        class="textarea"
        placeholder="Enter words or phrases separated by spaces..."
        rows="4"
      ></textarea>
      <p class="hint">Each word separated by space will be highlighted in a different color.</p>
    </div>

    <!-- TOGGLE: Active -->
    <div class="toggle-row">
      <div>
        <span class="toggle-label">Active</span>
        <p class="toggle-hint">Activate / deactivate highlighting</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="activeToggle" checked />
        <span class="slider"></span>
      </label>
    </div>

    <!-- TOGGLE: Case Sensitive -->
    <div class="toggle-row">
      <div>
        <span class="toggle-label">Case sensitive</span>
        <p class="toggle-hint">Match uppercase and lowercase exactly</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="caseSensitiveToggle" />
        <span class="slider"></span>
      </label>
    </div>

    <!-- TOGGLE: Diacritics -->
    <div class="toggle-row">
      <div>
        <span class="toggle-label">Diacritics</span>
        <p class="toggle-hint">e.g. "piękny" also matches "piekny"</p>
      </div>
      <label class="switch">
        <input type="checkbox" id="diacriticsToggle" checked />
        <span class="slider"></span>
      </label>
    </div>

    <!-- SEARCH BUTTON -->
    <button class="btn-search" id="searchBtn">Search & Highlight</button>

    <!-- CLEAR BUTTON -->
    <button class="btn-clear" id="clearBtn">Clear</button>

  </div>

  <script src="popup.js"></script>
</body>
</html>
