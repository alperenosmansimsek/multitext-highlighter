
<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --primary-color: #4D96FF;
      --primary-hover: #357AE8;
      --bg-color: #F8F9FA;
      --border-color: #E2E8F0;
      --text-color: #333333;
      --sub-text: #718096;
      --danger-border: rgba(220, 60, 60, 0.3);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #FFFFFF;
      color: var(--text-color);
      box-sizing: border-box;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .title-group h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 600;
    }

    .title-group span {
      font-size: 11px;
      font-style: italic;
      color: var(--sub-text);
    }

    .title-group span em {
      color: var(--primary-color);
      font-style: normal;
    }

    .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 4px;
      color: #4A5568;
    }

    .settings-panel {
      display: none;
      background: var(--bg-color);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 12px;
    }

    .setting-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .setting-item:last-child {
      margin-bottom: 0;
    }

    .section-title-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 12px;
      margin-bottom: 6px;
    }

    .section-title {
      font-size: 11px;
      font-weight: 700;
      color: var(--sub-text);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .mini-clear-btn {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--primary-color);
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 8px;
      cursor: pointer;
    }

    textarea {
      width: 100%;
      height: 100px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 8px;
      font-family: inherit;
      font-size: 13px;
      resize: vertical;
      box-sizing: border-box;
    }

    .info-text {
      font-size: 11px;
      color: var(--sub-text);
      margin-top: 4px;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .main-btn {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      padding: 10px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      margin-bottom: 8px;
    }

    .main-btn:hover {
      background-color: var(--primary-hover);
    }

    .secondary-btn {
      width: 100%;
      background-color: #EBF4FF;
      color: #2B6CB0;
      border: 1px solid #BEE3F8;
      border-radius: 6px;
      padding: 8px;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .matches-box {
      border: 1px solid var(--danger-border);
      border-radius: 6px;
      padding: 10px;
      min-height: 34px;
      max-height: 150px;
      overflow-y: auto;
      font-size: 13px;
      box-sizing: border-box;
      background-color: #FFF5F5;
    }

    .empty-text {
      color: var(--sub-text);
      font-style: italic;
    }

    .match-item {
      display: flex;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px dashed #FED7D7;
    }

    .match-item:last-child {
      border-bottom: none;
    }

    .asin-box {
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 10px;
      background-color: var(--bg-color);
      position: relative;
      font-size: 13px;
      box-sizing: border-box;
    }

    .asin-count-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .copy-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 16px;
      padding: 2px;
    }

    .mini-copy-btn {
      background: none;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
      padding: 2px 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mini-copy-btn:hover {
      background-color: var(--primary-color);
      color: white;
    }

    .asin-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .asin-tag {
      font-family: monospace;
      color: #6B46C1;
      background-color: #F3E8FF;
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
      font-size: 12px;
    }

    /* Fallback mode ASIN tags - warning color */
    .asin-tag.fallback {
      color: #E67700;
      background-color: #FFF3E0;
      border: 1px dashed #FFB74D;
    }

  </style>
</head>
<body>

  <div class="header">
    <div class="title-group">
      <h1>Multi Highlighter</h1>
      <span>launched by <em>aosimsek</em></span>
    </div>
    <button class="settings-btn" id="settingsToggle">⚙️</button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <div class="setting-item">
      <label for="toggleActive">Extension Active:</label>
      <input type="checkbox" id="toggleActive" checked>
    </div>
    <div class="setting-item">
      <label for="toggleCase">Case Sensitive (Lowercase/Uppercase):</label>
      <input type="checkbox" id="toggleCase">
    </div>
    <div class="setting-item">
      <label for="toggleDiacritics">Diacritics (Cześć=Czesc):</label>
      <input type="checkbox" id="toggleDiacritics">
    </div>
  </div>

  <div class="section-title-container">
    <span class="section-title">HIGHLIGHTED WORDS</span>
    <div style="display: flex; gap: 4px;">
      <button class="mini-copy-btn" id="copyPageBtn" title="Copy all text from page">📄 COPY</button>
      <button class="mini-clear-btn" id="miniClear">CLEAR</button>
    </div>
  </div>
  
  <textarea id="inputText" placeholder="Enter words or phrases separated by spaces..."></textarea>
  <div class="info-text">Each word separated by space will be highlighted.</div>

  <button class="main-btn" id="searchBtn">Search & Highlight</button>
  <button class="secondary-btn" id="clearAllBtn">Clear</button>

  <div class="section-title" style="margin-bottom: 6px;">Word Matches & Frequency</div>
  <div class="matches-box" id="matchesBox">
    <div class="empty-text">No active matches found.</div>
  </div>

  <div class="section-title" style="margin-top: 14px; margin-bottom: 6px;">⭐ ASIN Detector</div>
  <div class="asin-box">
    <div class="asin-count-row">
      <span>Number of ASINs: <span id="asinCount" style="color: #4D96FF;">0</span></span>
      <button class="copy-btn" id="copyAsinBtn" title="Copy">📋</button>
    </div>
    <div id="asinContainer" class="empty-text">No ASINs detected.</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
